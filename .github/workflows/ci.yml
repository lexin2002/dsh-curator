name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 零运行时依赖，不需要 npm install
      - name: Syntax check
        run: npm run check
      - name: Release-time unit tests
        run: npm test
